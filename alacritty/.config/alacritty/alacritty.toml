
[general]
import = [
    "~/.config/alacritty/custom_themes/ayu-mirage.toml"
]

[env]
TERM = "xterm-256color"
# font
[font]
size = 14

[font.bold]
family = "JetBrains Mono Nerd Font"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "JetBrains Mono Nerd Font"

[font.normal]
family = "JetBrains Mono Nerd Font"

[font.offset]
x = 0
y = 0

[window]
padding.x = 15
padding.y = 15
startup_mode = "Maximized"
decorations = "none"

